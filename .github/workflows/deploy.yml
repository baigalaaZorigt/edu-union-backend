# main руу push хийх бүрд: тест → (тэнцвэл) production руу deploy.
#
# Deploy нь SSH биш AWS SSM Run Command-оор явна: EC2-ийн 22 порт нэг IP-д л нээлттэй тул
# GitHub-ийн runner (IP нь байнга солигддог) SSH-ээр хүрэхгүй. AWS эрхийг OIDC-оор богино
# хугацаагаар авна — GitHub-д AWS түлхүүр, SSH түлхүүр хадгалахгүй.
# Анхны тохиргоо (нэг удаа): deploy/setup-github-deploy.sh
name: test-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}          # Actions табаас гараар дахин ажиллуулах

concurrency:
  group: production-deploy       # хоёр deploy зэрэг явахгүй
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  INSTANCE_ID: i-03648c2bcc4e19350
  APP_DIR: /opt/edu-union/app
  PUBLIC_URL: https://api.fmesu.mn

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # production контейнертэй ижил (Dockerfile)
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write                # OIDC → AWS role
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy (SSM → EC2)
        run: |
          set -euo pipefail
          # Сервер дээр: кодоо origin/main руу шилжүүлээд (rsync-ийн үлдэгдлийг цэвэрлэж)
          # ШИНЭ кодын remote-deploy.sh-г ажиллуулна; хуучин commit нь rollback цэг.
          G="git -c safe.directory=$APP_DIR"
          CMDS=$(jq -nc --arg app "$APP_DIR" --arg g "$G" '[
            "set -euo pipefail",
            "cd \($app)",
            "PREV=$(\($g) rev-parse HEAD)",
            "\($g) fetch --quiet origin main",
            "\($g) reset --hard origin/main",
            "\($g) clean -fd",
            "bash deploy/remote-deploy.sh \"$PREV\""
          ]')
          CID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "{\"commands\":$CMDS,\"executionTimeout\":[\"1800\"]}" \
            --query Command.CommandId --output text)
          echo "SSM command: $CID"

          STATUS=Pending
          for _ in $(seq 1 180); do                  # ≤ 30 мин
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" \
                       --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          echo "----- сервер дээрх гаралт -----"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true
          echo "Төлөв: $STATUS"
          [ "$STATUS" = Success ]

      - name: HTTPS шалгалт
        run: |
          set -euo pipefail
          check() {   # check <хүлээгдэх код> <зам>
            code=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL$2")
            echo "$code $2 (хүлээгдэх: $1)"; [ "$code" = "$1" ]
          }
          check 200 /api/public/portal_settings
          check 200 /api/portal/news
          check 200 /api/portal/forms
          check 401 /api/member
          check 401 /api/admin/forms
