# main руу push хийх бүрд: тест → (тэнцвэл) production руу deploy.
#
# Deploy нь SSH-ээр явна (EC2-ийн 22 порт бүх IP-д нээлттэй). Шаардлагатай repo secret-ууд:
#   EC2_SSH_KEY      — edu-union-key.pem-ийн агуулга
#   EC2_KNOWN_HOSTS  — серверийн host key (MITM-ээс хамгаална; `ssh-keygen -F <ip>`-ийн мөр)
name: test-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}          # Actions табаас гараар дахин ажиллуулах

concurrency:
  group: production-deploy       # хоёр deploy зэрэг явахгүй
  cancel-in-progress: false

permissions:
  contents: read

env:
  SSH_TARGET: ec2-user@13.196.178.202
  APP_DIR: /opt/edu-union/app
  PUBLIC_URL: https://api.fmesu.mn

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # production контейнертэй ижил (Dockerfile)
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH түлхүүр
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy (SSH → EC2)
        run: |
          # Сервер дээр: кодоо origin/main руу шилжүүлээд (rsync-ийн үлдэгдлийг цэвэрлэж)
          # ШИНЭ кодын remote-deploy.sh-г ажиллуулна; хуучин commit нь rollback цэг.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 "$SSH_TARGET" "sudo bash -s" <<SCRIPT
          set -euo pipefail
          cd $APP_DIR
          G="git -c safe.directory=$APP_DIR"
          PREV=\$(\$G rev-parse HEAD)
          \$G fetch --quiet origin main
          \$G reset --hard origin/main
          \$G clean -fd
          bash deploy/remote-deploy.sh "\$PREV" </dev/null
          SCRIPT

      - name: HTTPS шалгалт
        run: |
          set -euo pipefail
          check() {   # check <хүлээгдэх код> <зам>
            code=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL$2")
            echo "$code $2 (хүлээгдэх: $1)"; [ "$code" = "$1" ]
          }
          check 200 /api/public/portal_settings
          check 200 /api/portal/news
          check 200 /api/portal/forms
          check 401 /api/member
          check 401 /api/admin/forms
