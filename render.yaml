# Render.com дээр байршуулах тохиргоо (Infrastructure-as-Code / Blueprint).
# Blueprint-аар үүсгэсэн үед автоматаар хэрэглэгдэнэ. Дашбоардаар гар аргаар
# үүсгэсэн бол эдгээр командыг Settings дотор гараар оруулна уу (доор README-г үз).
services:
  - type: web
    name: edu-union-backend
    runtime: python
    # requirements суулгаад, схем + жишээ өгөгдлийг seed хийнэ (admin/admin123 үүснэ)
    buildCommand: "pip install -r requirements.txt && python db.py"
    # production WSGI сервер; Render-ийн $PORT-д bind хийнэ
    startCommand: "gunicorn run:app --bind 0.0.0.0:$PORT"

    # ---- Оруулсан файлууд (uploads/) ----
    # Гишүүний PDF хавсралт (uploads/member/) ба порталын зураг/файл
    # (uploads/content/) СЕРВЕРИЙН ДИСК дээр хадгалагдана. Render-ийн
    # энгийн файлын систем нь ТҮР ЗУУРЫНХ — redeploy/restart бүрт uploads/ ба
    # admin_units.db хоёул цэвэрлэгдэнэ. Байнга хадгалахын тулд доорхыг нээнэ үү
    # (Render-ийн Persistent Disk нь төлбөртэй instance шаарддаг, free plan дээр
    # ажиллахгүй тул одоогоор идэвхгүй байгаа):
    #
    # disk:
    #   name: uploads
    #   mountPath: /var/data
    #   sizeGB: 1
    # envVars:
    #   - key: UPLOAD_DIR
    #     value: /var/data/uploads/member    # client/union.py үүнийг уншина
    #   - key: CONTENT_UPLOAD_DIR
    #     value: /var/data/uploads/content   # admin/content.py үүнийг уншина
    #   - key: SECRET_KEY                    # JWT гарын үсэг — production-д заавал
    #     generateValue: true
