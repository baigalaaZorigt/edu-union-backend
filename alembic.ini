# Alembic — схемийн migration. Ихэвчлэн ГАРААР ажиллуулах шаардлагагүй: апп асахад
# core/db/bootstrap.migrate() нь `upgrade head` хийнэ. Шинэ migration:
#   .venv/bin/alembic revision -m "тайлбар"        (эсвэл --autogenerate, дараа нь заавал шалга)
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
