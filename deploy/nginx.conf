# /etc/nginx/conf.d/edu-union.conf
# Хостын nginx -> контейнерийн gunicorn (127.0.0.1:8000).
# certbot --nginx энэ файлыг өөрөө засаж 443 (TLS) блокийг нэмнэ.

server {
    listen 80;
    listen [::]:80;
    server_name  _;              # provision.sh домэйн өгвөл үүнийг солино

    # PDF/зураг оруулах: аппын хязгаар 50 MB тул түүнээс арай өгөөмөр
    client_max_body_size 60m;

    # Асуулгын хариу удаан ирдэг байдал (том жагсаалт) — хангалттай хугацаа
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Байршуулсан файлууд (портал токенгүй уншина) — кэш
    location /uploads/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        expires            7d;
        add_header         Cache-Control "public";
    }
}
