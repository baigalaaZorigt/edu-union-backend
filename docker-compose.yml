# EC2 дээрх ажиллагаа: аппын контейнер + хостын nginx (порт 80/443).
# Апп нь ЗӨВХӨН 127.0.0.1:8000 дээр сонсоно — гадаад ертөнц nginx-ээр л дамжина.
services:
  app:
    build: .
    image: edu-union-backend:latest
    container_name: edu-union-app
    restart: always
    # DATABASE_URL (RDS), SECRET_KEY, CORS_ORIGINS — provision.sh үүсгэнэ
    env_file:
      - /opt/edu-union/.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Оруулсан PDF/зураг — контейнер шинэчлэгдэхэд ч үлдэнэ
      - /opt/edu-union/data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/portal/forms').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
